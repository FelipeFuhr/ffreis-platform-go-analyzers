name: CI

# Triggers: every PR and every push to main.
# Job dependency graph:
#
#   secret-scan ─┐
#   fmt ─────────┼─→ lint ─────────────┐
#                ├─→ test ─────────────┤
#                ├─→ coverage ─────────┤
#                └─→ integration-coverage
#
# coverage/integration-coverage gate line coverage (75%) independently of
# lint/test; integration-coverage is a no-op skip until //go:build integration
# files exist.
# Any failure blocks downstream jobs.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # scan-fix(gha:stale-go-pin): floating "1.25" (matches code-quality.yml's
  # convention) so setup-go always resolves the latest 1.25.x patch — the
  # exact-pinned "1.25.0" fell behind go.mod's `go 1.25.8` directive
  # (bumped for stdlib CVE fixes in #1) and broke Test/Lint/Coverage with
  # "go.mod requires go >= 1.25.8 (running go 1.25.0)" on every push since.
  GO_VERSION: "1.25"

jobs:

  # ── 1. Secret scan ─────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-gitleaks.yml@3858e9e74c805067e454740b195372c7195f333b # v1.5.0
    with:
      working-directory: "."
      scan-history: true
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

  # ── 2. Format check ────────────────────────────────────────────────────────
  fmt:
    name: Format (gofmt)
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: ${{ vars.GO_VERSION || '1.25' }}
      working-directory: "."

  # ── 3. Lint ─────────────────────────────────────────────────────────────────
  lint:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint (golangci-lint)
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ vars.GO_VERSION || env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v7.0.0
        with:
          version: latest
          args: --timeout=5m

  # ── 4. Test ─────────────────────────────────────────────────────────────────
  test:
    if: ${{ !github.event.pull_request.draft }}
    name: Test
    permissions:
      contents: read
      # go-test.yml's job unconditionally requests id-token: write for its L2
      # S3-cache OIDC step (no-op here — we pass no go-cache-s3 input, so the
      # step never runs). The caller must still grant the ceiling or GitHub
      # rejects the whole workflow file at parse time with startup_failure.
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: ${{ vars.GO_VERSION || '1.25' }}
      working-directory: "."
      run-govulncheck: false

  # ── 5. Coverage gates (unit + integration) ─────────────────────────────────
  coverage:
    if: ${{ !github.event.pull_request.draft }}
    name: Coverage
    needs: [fmt]
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: ${{ vars.GO_VERSION || '1.25' }}
      working-directory: "."
      coverage-threshold: 75

  integration-coverage:
    if: ${{ !github.event.pull_request.draft }}
    name: Integration Coverage
    needs: [fmt]
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-integration-coverage.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: ${{ vars.GO_VERSION || '1.25' }}
      working-directory: "."
      coverage-threshold: 75
